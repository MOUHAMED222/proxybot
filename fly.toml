app = 'proxybot'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  USER_DATA_DIR = '/app/user_data'

# مجلد واحد فقط - سيتم استخدامه لتخزين بيانات المستخدمين والحاويات
[[mounts]]
  source = 'user_data'
  destination = '/app/user_data'

[http_service]
  internal_port = 8600
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 8
  memory_mb = 8192
  privileged = true   # ضروري لتشغيل Docker daemon داخل الحاوية
